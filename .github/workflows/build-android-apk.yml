name: Build Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verificar WAVs e catálogo
        run: python3 Tools/validate_project.py
      - name: Cache do Unity
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-2022.3.62f1-android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: unity-2022.3.62f1-android-
      - name: Compilar APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.62f1
          targetPlatform: Android
          buildMethod: PatrulhaCanina.Editor.AutoFullGameSetup.BuildAndroid
          allowDirtyBuild: true
      - name: Publicar APK nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PatrulhaCanina-Android-APK
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unity-logs
          path: |
            **/Editor.log
            build/**/*.log
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PatrulhaCanina-Android-APK
          path: apk
      - name: Anexar APK à Release da tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "APK Android gerado automaticamente."
          gh release upload "$RELEASE_TAG" apk/*.apk --clobber
