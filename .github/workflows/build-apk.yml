name: Android APK (sem licença Unity)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
      - name: SDK e Build Tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Empacotar e verificar falas offline
        run: |
          python3 Tools/sync_android_assets.py
          python3 Tools/validate_android.py
      - name: Testar as seis missões no Chromium
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          npm test
      - name: Compilar APK debug assinado
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug
      - name: Nomear APK para download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PatrulhaCanina-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/PatrulhaCanina.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/PatrulhaCanina.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PatrulhaCanina-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PatrulhaCanina-APK
          path: dist
      - name: Criar ou atualizar Release latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$COMMIT_SHA" -F force=true
            gh release edit latest --title 'Patrulha Canina - Missões (APK)' --notes 'APK Android offline. Assinatura pública de desenvolvimento; não é distribuição de produção.' --latest
          else
            gh release create latest --target "$COMMIT_SHA" --title 'Patrulha Canina - Missões (APK)' --notes 'APK Android offline. Assinatura pública de desenvolvimento; não é distribuição de produção.' --latest
          fi
          gh release upload latest dist/PatrulhaCanina.apk --clobber
