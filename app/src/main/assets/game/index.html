<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob:; connect-src 'self'; img-src 'self' data: blob:">
<title>Patrulha Canina — Aventura 3D</title><link rel="stylesheet" href="style.css"></head>
<body><canvas id="game" aria-label="Mundo tridimensional em terceira pessoa"></canvas>
<div id="interface">
 <div id="top"><div id="score">Preparando a Baía 3D…</div><button data-action="repeat" id="pup-pad">Pup-Pad · Ouvir</button><button data-action="mute" id="mute">Som ligado</button><canvas id="radar" width="180" height="140" aria-label="Mapa das quatro áreas"></canvas></div>
 <div id="objective">Explore a Baía da Aventura em três dimensões!</div>
 <div id="joystick" aria-label="Analógico de movimento"><div id="knob"></div></div>
 <div id="actions">
  <button id="jump" data-action="jump"><span>↑</span>Pular / Turbo</button>
  <button id="vehicle" data-action="vehicle"><span>🚒</span>Dirigir veículo</button>
  <button id="tool" data-action="tool"><span>⚽</span>Mochila / Chute</button>
  <button id="friends" data-action="friends"><span>🐾</span>Trocar amigo</button>
  <button id="areas" data-action="areas"><span>🗺</span>Viajar</button>
 </div>
</div>
<div id="caption" role="status" aria-live="polite">Use o analógico para andar. Arraste à direita para olhar ao redor.</div>
<div id="modal" hidden></div>
<div id="rotate" hidden>Gire o aparelho para explorar deitado ↻</div>
<div id="webgl-error" hidden>Não foi possível iniciar o mundo 3D neste WebView. Atualize o Android System WebView e abra novamente.</div>
<script src="/js/three.min.js"></script><script src="world.js"></script><script src="audio.js"></script><script src="models.js"></script><script src="game.js"></script>
</body></html>
